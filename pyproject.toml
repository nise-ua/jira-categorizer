[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jira-enclave-categorizer"
version = "0.1.0"
description = "Secure-enclave MLOps for Jira ticket categorization (labels + impacted area). Classical ML, Python only, no LLM."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "MLOps" }]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "scikit-learn>=1.4",
  "joblib>=1.3",
  "pyyaml>=6.0",
  "cryptography>=42.0",
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "httpx>=0.27",
  "python-dateutil>=2.8",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=4.1",
  "ruff>=0.3",
]

[project.scripts]
jira-cat-train = "jira_categorizer.train.train:main"
jira-cat-predict = "jira_categorizer.infer.predict:main"
jira-cat-serve = "jira_categorizer.enclave.server:main"
jira-cat-pipeline = "jira_categorizer.pipeline.mlops:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
